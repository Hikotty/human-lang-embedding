[project]
name = "human-lang-embedding"
version = "0.1.0"
description = "AI文章を人間が校正するためのトラックチェンジ付きレビューエディタMCPサーバー"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
hle-mcp = "hle_mcp.server:main"
hle-admin = "hle_mcp.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
